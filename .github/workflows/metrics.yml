name: GitHub Metrics

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Psyodrz
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html,css,scss,json,yaml,markdown
          plugin_languages_colors: "0:#00e5ff, 1:#7c4dff, 2:#3fb950, 3:#ffab00, 4:#8b949e"
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          plugin_music_limit: 4
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 0, 8
