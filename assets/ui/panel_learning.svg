<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
<defs>
    <filter id="pg"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .pulse2 { animation: pulse 2s ease-in-out infinite alternate; }
    .blink { animation: blink 1s step-end infinite; }
    .scan { animation: scan 6s linear infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .rotate { animation: rotate 12s linear infinite; }
    .slideIn { animation: slideIn 1.5s ease-out forwards; }
    .glow { animation: glow 2s ease-in-out infinite alternate; }
    .dataScroll { animation: dataScroll 8s linear infinite; }
    .fadeInUp { animation: fadeInUp 1s ease-out forwards; }
    .sweep { animation: sweep 3s ease-in-out infinite; }
    @keyframes pulse { 0%{opacity:.3} 100%{opacity:.9} }
    @keyframes blink { 50%{opacity:0} }
    @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes rotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes slideIn { 0%{opacity:0;transform:translateX(-20px)} 100%{opacity:1;transform:translateX(0)} }
    @keyframes glow { 0%{filter:drop-shadow(0 0 2px #00e5ff40)} 100%{filter:drop-shadow(0 0 8px #00e5ff80)} }
    @keyframes dataScroll { 0%{transform:translateY(0)} 100%{transform:translateY(-50%)} }
    @keyframes fadeInUp { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes sweep { 0%,100%{opacity:.2} 50%{opacity:.6} }
</style>
</defs>
<rect width="320" height="200" rx="10" fill="#0d1117"/>
<rect width="320" height="200" rx="10" fill="none" stroke="#1a1f2b" stroke-width="1"/>

    <polyline points="12,1 1,1 1,12" fill="none" stroke="#7c4dff" stroke-width="1.5" class="glow"/>
    <polyline points="308,1 319,1 319,12" fill="none" stroke="#7c4dff" stroke-width="1.5" class="glow"/>
    <polyline points="1,188 1,199 12,199" fill="none" stroke="#7c4dff" stroke-width="1.5" class="glow"/>
    <polyline points="319,188 319,199 308,199" fill="none" stroke="#7c4dff" stroke-width="1.5" class="glow"/>
<rect x="0" y="0" width="320" height="3" fill="#00e5ff" opacity="0.04" class="scan"/>
<!-- Title -->
<rect x="14" y="8" width="86" height="20" rx="4" fill="#7c4dff" fill-opacity="0.1" stroke="#7c4dff" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="24" y="22" font-family="'Courier New',Consolas,monospace" font-size="9" font-weight="700" fill="#7c4dff" letter-spacing="1.5">LEARNING</text>
<!-- Status dot -->
<circle cx="302" cy="18" r="3" fill="#7c4dff" opacity="0.5" class="pulse2"/>

        <text x="20" y="50" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">Rust <tspan fill="#ffab00" font-family="'Courier New',Consolas,monospace" font-size="9">70%</tspan></text>
        <rect x="20" y="55" width="280" height="6" rx="3" fill="#1a1f2b"/>
        <rect x="20" y="55" width="182" height="6" rx="3" fill="#ffab00" class="glow">
            <animate attributeName="width" from="0" to="182" dur="1.5s" fill="freeze"/>
        </rect>
        <text x="20" y="84" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">System Design <tspan fill="#7c4dff" font-family="'Courier New',Consolas,monospace" font-size="9">85%</tspan></text>
        <rect x="20" y="89" width="280" height="6" rx="3" fill="#1a1f2b"/>
        <rect x="20" y="89" width="221" height="6" rx="3" fill="#7c4dff" class="glow">
            <animate attributeName="width" from="0" to="221" dur="1.5s" fill="freeze"/>
        </rect>
        <text x="20" y="118" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">DevOps/K8s <tspan fill="#00e5ff" font-family="'Courier New',Consolas,monospace" font-size="9">60%</tspan></text>
        <rect x="20" y="123" width="280" height="6" rx="3" fill="#1a1f2b"/>
        <rect x="20" y="123" width="156" height="6" rx="3" fill="#00e5ff" class="glow">
            <animate attributeName="width" from="0" to="156" dur="1.5s" fill="freeze"/>
        </rect>
        <text x="20" y="152" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">ML/AI <tspan fill="#3fb950" font-family="'Courier New',Consolas,monospace" font-size="9">40%</tspan></text>
        <rect x="20" y="157" width="280" height="6" rx="3" fill="#1a1f2b"/>
        <rect x="20" y="157" width="104" height="6" rx="3" fill="#3fb950" class="glow">
            <animate attributeName="width" from="0" to="104" dur="1.5s" fill="freeze"/>
        </rect>
</svg>