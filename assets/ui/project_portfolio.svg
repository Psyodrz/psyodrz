    <text x="410" y="83" text-anchor="middle" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#00e5ff" opacity="0.15" class="float">&#x2B21;</text>
    <!-- Animated scan -->
    <rect x="20" y="42" width="450" height="2" fill="#00e5ff" opacity="0.06" class="scan"/>
    

    <rect x="20" y="130" width="67" height="20" rx="10" fill="#1a1f2b" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.5"/>
    <text x="53" y="144" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="9" fill="#8b949e">Next.js</text>
