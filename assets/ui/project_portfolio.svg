    <rect x="400" y="130" width="55" height="20" rx="10" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.4" stroke-width="0.5" class="glow"/>
    <circle cx="414" cy="140" r="3" fill="#3fb950" class="pulse2"/>
    <text x="432" y="144" font-family="'Courier New',Consolas,monospace" font-size="9" fill="#3fb950" font-weight="700">LIVE</text>
<text x="20" y="175" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">
    <tspan x="20" dy="0">High-performance portfolio with Next.js, fluid animatio</tspan>
