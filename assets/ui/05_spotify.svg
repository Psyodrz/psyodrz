            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.0s" repeatCount="indefinite"/>
        </rect>
        <rect x="24" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="32" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="1.4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="40" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="0.6s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="0.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="48" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="56" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="1.0s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.0s" repeatCount="indefinite"/>
        </rect>
        <rect x="64" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="72" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="1.4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="80" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="0.6s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="0.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="88" y="0" width="4" height="24" rx="2" fill="#1db954">
            <animate attributeName="height" values="6;24;10;28;8;20;6" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="y" values="18;0;14;0;16;4;18" dur="0.8s" repeatCount="indefinite"/>
        </rect>
    </g>
</g>
</svg>