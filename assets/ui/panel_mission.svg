<svg width="320" height="148" viewBox="0 0 320 148" xmlns="http://www.w3.org/2000/svg">
<defs>
    <filter id="pg"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .pulse2 { animation: pulse 2s ease-in-out infinite alternate; }
    .blink { animation: blink 1s step-end infinite; }
    .scan { animation: scan 6s linear infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .rotate { animation: rotate 12s linear infinite; }
    .slideIn { animation: slideIn 1.5s ease-out forwards; }
    .glow { animation: glow 2s ease-in-out infinite alternate; }
    .dataScroll { animation: dataScroll 8s linear infinite; }
    .fadeInUp { animation: fadeInUp 1s ease-out forwards; }
    .sweep { animation: sweep 3s ease-in-out infinite; }
    @keyframes pulse { 0%{opacity:.3} 100%{opacity:.9} }
    @keyframes blink { 50%{opacity:0} }
    @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes rotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes slideIn { 0%{opacity:0;transform:translateX(-20px)} 100%{opacity:1;transform:translateX(0)} }
    @keyframes glow { 0%{filter:drop-shadow(0 0 2px #00e5ff40)} 100%{filter:drop-shadow(0 0 8px #00e5ff80)} }
    @keyframes dataScroll { 0%{transform:translateY(0)} 100%{transform:translateY(-50%)} }
    @keyframes fadeInUp { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes sweep { 0%,100%{opacity:.2} 50%{opacity:.6} }
</style>
</defs>
<rect width="320" height="148" rx="10" fill="#0d1117"/>
<rect width="320" height="148" rx="10" fill="none" stroke="#1a1f2b" stroke-width="1"/>

    <polyline points="12,1 1,1 1,12" fill="none" stroke="#3fb950" stroke-width="1.5" class="glow"/>
    <polyline points="308,1 319,1 319,12" fill="none" stroke="#3fb950" stroke-width="1.5" class="glow"/>
    <polyline points="1,136 1,147 12,147" fill="none" stroke="#3fb950" stroke-width="1.5" class="glow"/>
    <polyline points="319,136 319,147 308,147" fill="none" stroke="#3fb950" stroke-width="1.5" class="glow"/>
<rect x="0" y="0" width="320" height="3" fill="#00e5ff" opacity="0.04" class="scan"/>
<!-- Title -->
<rect x="14" y="8" width="135" height="20" rx="4" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="24" y="22" font-family="'Courier New',Consolas,monospace" font-size="9" font-weight="700" fill="#3fb950" letter-spacing="1.5">CURRENT MISSION</text>
<!-- Status dot -->
<circle cx="302" cy="18" r="3" fill="#3fb950" opacity="0.5" class="pulse2"/>

    <g transform="translate(20, 48)">
        <circle cx="5" cy="5" r="4" fill="#3fb950" class="pulse"/>
        <text x="16" y="9" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#e6edf3" font-weight="600">Production-grade Applications</text>
        <text x="16" y="28" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#e6edf3" font-weight="500">Real-time Systems &amp; APIs</text>
    </g>
    <line x1="20" y1="90" x2="300" y2="90" stroke="#1a1f2b" stroke-width="0.5"/>
    <text x="20" y="110" font-family="'Courier New',Consolas,monospace" font-size="9" fill="#8b949e" letter-spacing="0.5">
        <tspan fill="#3fb950">FOCUS</tspan> Architecture // DX // Perf
    </text>
    <text x="20" y="128" font-family="'Courier New',Consolas,monospace" font-size="9" fill="#8b949e">
        <tspan fill="#3fb950">PRIO</tspan> Clean Code // Type Safety // Scale
    </text>
</svg>