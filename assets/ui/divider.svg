<svg width="1000" height="24" viewBox="0 0 1000 24" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0a0a0f" />
        <stop offset="20%" stop-color="#00e5ff" />
        <stop offset="50%" stop-color="#7c4dff" />
        <stop offset="80%" stop-color="#00e5ff" />
        <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <style>
        .divPulse { animation: divp 3s ease-in-out infinite alternate; }
        @keyframes divp { from { opacity:0.4; } to { opacity:0.9; } }
    </style>
</defs>
<line x1="0" y1="12" x2="1000" y2="12" stroke="url(#divGrad)" stroke-width="1" class="divPulse"/>
<circle cx="500" cy="12" r="3" fill="#00e5ff" opacity="0.7" class="divPulse"/>
</svg>