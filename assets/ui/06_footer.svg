<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
<defs><style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');

    .glow-cyan { filter: drop-shadow(0 0 4px #00f0ff60); }
    .glow-violet { filter: drop-shadow(0 0 4px #8a2be260); }
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .pulse-fast { animation: pulse 1.5s ease-in-out infinite alternate; }
    .blink { animation: blink 1s step-end infinite; }
    .scanline { animation: scan 8s linear infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .rotate-slow { animation: rotate 20s linear infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style></defs>

<rect width="1000" height="120" rx="10" fill="#0a0e17" stroke="#161f30" stroke-width="1"/><rect width="998" height="118" x="1" y="1" rx="9" fill="none" stroke="#00f0ff40" stroke-width="0.5"/>
        <polyline points="14,2 2,2 2,14" fill="none" stroke="#00f0ff" stroke-width="1.5" class="glow-cyan"/>
        <polyline points="986,2 998,2 998,14" fill="none" stroke="#00f0ff" stroke-width="1.5" class="glow-cyan"/>
        <polyline points="2,106 2,118 14,118" fill="none" stroke="#00f0ff" stroke-width="1.5" class="glow-cyan"/>
        <polyline points="998,106 998,118 986,118" fill="none" stroke="#00f0ff" stroke-width="1.5" class="glow-cyan"/>
        
<rect width="1000" height="4" fill="#00f0ff" opacity="0.04" class="scanline"/>

<text x="500" y="45" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#f0f6fc" font-style="italic" class="pulse">
    "Any sufficiently advanced technology is indistinguishable from magic." — Arthur C. Clarke
</text>

<line x1="100" y1="65" x2="900" y2="65" stroke="#161f30" stroke-width="1"/>

<text x="500" y="88" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'ui-monospace', 'Liberation Mono', monospace" font-size="10" fill="#8b949e" letter-spacing="1">
    DESIGNED &amp; ENGINEERED BY ADITYA SRIVASTAVA // BUILT WITH PRECISION &amp; OBSESSION
</text>
</svg>