    <rect width="220" height="24" rx="8" fill="#161f30" opacity="0.6"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f56"/>
    <circle cx="27" cy="12" r="3" fill="#ffbd2e"/>
    <circle cx="39" cy="12" r="3" fill="#27c93f"/>
