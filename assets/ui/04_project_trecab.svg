        <rect x="252" y="0" width="84" height="24" rx="12" fill="#161f30" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="0.5"/>
        <text x="294" y="16" text-anchor="middle" font-family="'Fira Code', 'Courier New', Consolas, monospace" font-size="10" fill="#00f0ff">Maps API</text>
    </g>
</g>


</svg>