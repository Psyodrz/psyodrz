    <rect x="15" y="74" width="160" height="6" rx="3" fill="#8b949e" opacity="0.2"/>
    <rect x="15" y="88" width="140" height="6" rx="3" fill="#8b949e" opacity="0.2"/>
    
    <rect x="15" y="110" width="80" height="30" rx="4" fill="#8a2be2" opacity="0.3"/>
    <rect x="105" y="110" width="100" height="30" rx="4" fill="#00f0ff" opacity="0.2"/>
</g>

<!-- Main Details (Right side) -->
<g transform="translate(275, 30)">
    <text x="0" y="0" font-family="'Fira Code', 'Courier New', Consolas, monospace" font-size="10" fill="#8b949e">PROJECT 01 // FEATURED BUILD</text>
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f0f6fc">TreCab</text>
    <text x="0" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00f0ff">Full-Stack Ride-Hailing Platform</text>

    <text x="0" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" width="650">
