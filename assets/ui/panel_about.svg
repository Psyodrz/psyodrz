<svg width="320" height="185" viewBox="0 0 320 185" xmlns="http://www.w3.org/2000/svg">
<defs>
    <filter id="pg"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }
    .pulse2 { animation: pulse 2s ease-in-out infinite alternate; }
    .blink { animation: blink 1s step-end infinite; }
    .scan { animation: scan 6s linear infinite; }
    .float { animation: float 4s ease-in-out infinite; }
    .rotate { animation: rotate 12s linear infinite; }
    .slideIn { animation: slideIn 1.5s ease-out forwards; }
    .glow { animation: glow 2s ease-in-out infinite alternate; }
    .dataScroll { animation: dataScroll 8s linear infinite; }
    .fadeInUp { animation: fadeInUp 1s ease-out forwards; }
    .sweep { animation: sweep 3s ease-in-out infinite; }
    @keyframes pulse { 0%{opacity:.3} 100%{opacity:.9} }
    @keyframes blink { 50%{opacity:0} }
    @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes rotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes slideIn { 0%{opacity:0;transform:translateX(-20px)} 100%{opacity:1;transform:translateX(0)} }
    @keyframes glow { 0%{filter:drop-shadow(0 0 2px #00e5ff40)} 100%{filter:drop-shadow(0 0 8px #00e5ff80)} }
    @keyframes dataScroll { 0%{transform:translateY(0)} 100%{transform:translateY(-50%)} }
    @keyframes fadeInUp { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes sweep { 0%,100%{opacity:.2} 50%{opacity:.6} }
</style>
</defs>
<rect width="320" height="185" rx="10" fill="#0d1117"/>
<rect width="320" height="185" rx="10" fill="none" stroke="#1a1f2b" stroke-width="1"/>

    <polyline points="12,1 1,1 1,12" fill="none" stroke="#00e5ff" stroke-width="1.5" class="glow"/>
    <polyline points="308,1 319,1 319,12" fill="none" stroke="#00e5ff" stroke-width="1.5" class="glow"/>
    <polyline points="1,173 1,184 12,184" fill="none" stroke="#00e5ff" stroke-width="1.5" class="glow"/>
    <polyline points="319,173 319,184 308,184" fill="none" stroke="#00e5ff" stroke-width="1.5" class="glow"/>
<rect x="0" y="0" width="320" height="3" fill="#00e5ff" opacity="0.04" class="scan"/>
<!-- Title -->
<rect x="14" y="8" width="86" height="20" rx="4" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="0.5"/>
<text x="24" y="22" font-family="'Courier New',Consolas,monospace" font-size="9" font-weight="700" fill="#00e5ff" letter-spacing="1.5">ABOUT ME</text>
<!-- Status dot -->
<circle cx="302" cy="18" r="3" fill="#00e5ff" opacity="0.5" class="pulse2"/>

    <text x="20" y="52" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#e6edf3" font-weight="500">
        <tspan x="20" dy="0">Full-stack engineer obsessed with</tspan>
        <tspan x="20" dy="20">crafting performant systems and</tspan>
        <tspan x="20" dy="20">interfaces that feel alive.</tspan>
    </text>
    <line x1="20" y1="115" x2="300" y2="115" stroke="#1a1f2b" stroke-width="0.5"/>
    <text x="20" y="132" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#8b949e">
        <tspan fill="#00e5ff">LOC</tspan> India // UTC+5:30
    </text>
    <text x="20" y="148" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#8b949e">
        <tspan fill="#00e5ff">MODE</tspan> Remote Collaboration
    </text>
    <text x="20" y="164" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#8b949e">
        <tspan fill="#3fb950">STATUS</tspan> Open to Work
    </text>
</svg>