        <rect x="20" y="145" width="280" height="5" rx="2.5" fill="#1a1f2b"/>
        <rect x="20" y="145" width="208" height="5" rx="2.5" fill="#3fb950">
            <animate attributeName="width" from="0" to="208" dur="1.2s" fill="freeze"/>
        </rect>
        <text x="20" y="170" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8b949e">System Design</text>
        <text x="295" y="170" text-anchor="end" font-family="'Courier New',Consolas,monospace" font-size="10" fill="#f85149">75%</text>
        <rect x="20" y="175" width="280" height="5" rx="2.5" fill="#1a1f2b"/>
        <rect x="20" y="175" width="195" height="5" rx="2.5" fill="#f85149">
